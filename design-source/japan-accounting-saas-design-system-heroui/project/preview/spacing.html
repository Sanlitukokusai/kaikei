<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans)}
.row{display:flex;flex-direction:column;gap:6px}
.tk{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--foreground-700)}
.bar{height:14px;background:var(--blue-500);border-radius:3px}
.name{width:50px;font-family:var(--font-numeric);font-weight:600;color:var(--foreground)}
.px{margin-left:auto;font-family:var(--font-numeric);color:var(--foreground-400)}
</style></head><body>
<div class="row">
<div class="tk"><span class="name">--1</span><div class="bar" style="width:4px"></div><span class="px">4 px</span></div>
<div class="tk"><span class="name">--2</span><div class="bar" style="width:8px"></div><span class="px">8 px</span></div>
<div class="tk"><span class="name">--3</span><div class="bar" style="width:12px"></div><span class="px">12 px</span></div>
<div class="tk"><span class="name">--4</span><div class="bar" style="width:16px"></div><span class="px">16 px</span></div>
<div class="tk"><span class="name">--6</span><div class="bar" style="width:24px"></div><span class="px">24 px</span></div>
<div class="tk"><span class="name">--8</span><div class="bar" style="width:32px"></div><span class="px">32 px</span></div>
<div class="tk"><span class="name">--12</span><div class="bar" style="width:48px"></div><span class="px">48 px</span></div>
<div class="tk"><span class="name">--16</span><div class="bar" style="width:64px"></div><span class="px">64 px</span></div>
</div></body></html>
