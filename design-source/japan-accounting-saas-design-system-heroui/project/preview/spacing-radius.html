<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans)}
.row{display:flex;gap:20px;align-items:flex-end}
.spec{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{width:96px;height:64px;background:var(--blue-100);border:1px solid var(--blue-300)}
.lbl{font-size:11px;color:var(--foreground-500);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.val{font-family:var(--font-numeric);font-size:11px;color:var(--foreground-700)}
</style></head><body>
<div class="row">
  <div class="spec"><div class="box" style="border-radius:0"></div><div class="lbl">none</div><div class="val">0</div></div>
  <div class="spec"><div class="box" style="border-radius:8px"></div><div class="lbl">small</div><div class="val">8px</div></div>
  <div class="spec"><div class="box" style="border-radius:12px"></div><div class="lbl">medium</div><div class="val">12px</div></div>
  <div class="spec"><div class="box" style="border-radius:14px"></div><div class="lbl">large</div><div class="val">14px</div></div>
  <div class="spec"><div class="box" style="border-radius:9999px"></div><div class="lbl">full</div><div class="val">9999px</div></div>
</div>
</body></html>
