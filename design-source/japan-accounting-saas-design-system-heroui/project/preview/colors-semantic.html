<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--background)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{border-radius:12px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:6px;font-family:var(--font-sans)}
.card .name{font-weight:600;font-size:14px}
.card .hex{font-family:var(--font-numeric);font-size:11px;opacity:.85;letter-spacing:.04em}
.card .use{font-size:11px;opacity:.85}
</style></head><body>
<div class="grid">
<div class="card" style="background:#17c964;color:#000"><div class="name">success</div><div class="hex">#17c964</div><div class="use">入金 · 確定済 · 一致</div></div>
<div class="card" style="background:#f5a524;color:#000"><div class="name">warning</div><div class="hex">#f5a524</div><div class="use">確認待ち · 下書き</div></div>
<div class="card" style="background:#f31260"><div class="name">danger</div><div class="hex">#f31260</div><div class="use">出金 · エラー</div></div>
<div class="card" style="background:#7828c8"><div class="name">secondary</div><div class="hex">#7828c8</div><div class="use">補助CTA · 控えめ</div></div>
</div>
</body></html>
