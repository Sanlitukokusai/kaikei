<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>

<div class="swatch" style="background:#71717a">500<span>#71717a</span></div>
<div class="swatch" style="background:#52525b">600<span>#52525b</span></div>
<div class="swatch" style="background:#3f3f46">700<span>#3f3f46</span></div>
<div class="swatch" style="background:#27272a">800<span>#27272a</span></div>
<div class="swatch" style="background:#18181b">900<span>#18181b</span></div>
</div>
</body></html>
