<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans);font-size:13px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--foreground-500);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--zinc-200);background:var(--zinc-50)}
td{padding:10px;border-bottom:1px solid var(--zinc-100);color:var(--foreground)}
tr:hover td{background:var(--zinc-50)}
.num{font-family:var(--font-numeric);font-variant-numeric:tabular-nums;text-align:right}
.pos{color:var(--money-positive);font-weight:600}
.neg{color:var(--money-negative);font-weight:600}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:9999px;font-size:11px;font-weight:500}
.chip.s{background:#d1f4e0;color:#0e793c}
.chip.w{background:#fdedd3;color:#936316}
.code{font-family:var(--font-mono);color:var(--foreground-500);font-size:12px}
</style></head><body>
<table>
  <thead><tr><th>日付</th><th>取引</th><th>勘定科目</th><th class="num">借方</th><th class="num">貸方</th><th>状態</th></tr></thead>
  <tbody>
    <tr><td>2026/05/03</td><td>株式会社東京商事 — 売上 <span class="code">INV-0482</span></td><td>売掛金</td><td class="num pos">¥284,500</td><td class="num">—</td><td><span class="chip s">確定済</span></td></tr>
    <tr><td>2026/05/02</td><td>三菱UFJ銀行 — 振込手数料</td><td>支払手数料</td><td class="num">—</td><td class="num neg">¥440</td><td><span class="chip w">確認待ち</span></td></tr>
  </tbody>
</table>
</body></html>
