<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:32px;background:var(--background);font-family:var(--font-sans)}
.row{display:flex;gap:32px;align-items:flex-end}
.spec{display:flex;flex-direction:column;align-items:center;gap:10px}
.box{width:140px;height:64px;background:#fff;border-radius:14px}
.lbl{font-size:11px;color:var(--foreground-500);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
</style></head><body>
<div class="row">
  <div class="spec"><div class="box" style="box-shadow:var(--shadow-small)"></div><div class="lbl">small</div></div>
  <div class="spec"><div class="box" style="box-shadow:var(--shadow-medium)"></div><div class="lbl">medium</div></div>
  <div class="spec"><div class="box" style="box-shadow:var(--shadow-large)"></div><div class="lbl">large</div></div>
</div>
</body></html>
