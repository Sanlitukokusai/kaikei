<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:500}
.dot{width:6px;height:6px;border-radius:50%}
.chip.success{background:#d1f4e0;color:#0e793c} .chip.success .dot{background:#17c964}
.chip.warning{background:#fdedd3;color:#936316} .chip.warning .dot{background:#f5a524}
.chip.danger{background:#fdd0df;color:#920b3a} .chip.danger .dot{background:#f31260}
.chip.info{background:#cce3fd;color:#004493} .chip.info .dot{background:#006FEE}
.chip.neutral{background:#f4f4f5;color:#3f3f46} .chip.neutral .dot{background:#71717a}
.lbl{font-size:11px;color:var(--foreground-500);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
</style></head><body>
<div class="lbl">Status chips · 仕訳・取引ステータス</div>
<div class="row">
  <span class="chip success"><span class="dot"></span>確定済</span>
  <span class="chip warning"><span class="dot"></span>確認待ち</span>
  <span class="chip danger"><span class="dot"></span>差戻し</span>
  <span class="chip info"><span class="dot"></span>下書き</span>
  <span class="chip neutral"><span class="dot"></span>仕訳済</span>
  <span class="chip neutral">課税10%</span>
  <span class="chip neutral">適格</span>
  <span class="chip neutral">非課税</span>
</div>
</body></html>
