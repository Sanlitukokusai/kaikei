<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--background)}
.stack>*+*{margin-top:10px}
.lbl{font:500 10px/1 var(--font-sans);color:var(--foreground-500);text-transform:uppercase;letter-spacing:.08em;display:inline-block;width:80px}
.smp{font-family:var(--font-sans);color:var(--foreground)}
.line{display:flex;align-items:baseline;gap:16px}
.meta{font:500 11px var(--font-numeric);color:var(--foreground-400);margin-left:auto}
</style></head><body>
<div class="stack">
  <div class="line"><span class="lbl">H1</span><span class="smp h1">月次レポート — 2026年4月</span><span class="meta">30 / 700</span></div>
  <div class="line"><span class="lbl">H2</span><span class="smp h2">売上の内訳と前年比</span><span class="meta">24 / 600</span></div>
  <div class="line"><span class="lbl">H3</span><span class="smp h3">主要勘定科目の推移</span><span class="meta">20 / 600</span></div>
  <div class="line"><span class="lbl">H4</span><span class="smp h4">サブセクション見出し</span><span class="meta">18 / 600</span></div>
  <div class="line"><span class="lbl">Eyebrow</span><span class="smp eyebrow">ダッシュボード</span><span class="meta">12 / 600 / uppercase</span></div>
</div>
</body></html>
