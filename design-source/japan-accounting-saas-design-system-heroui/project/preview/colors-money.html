<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.cell{padding:14px 16px;border-radius:12px;background:var(--content2);display:flex;flex-direction:column;gap:6px}
.cell .lbl{font-size:11px;color:var(--foreground-500);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.cell .val{font-family:var(--font-numeric);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--money-positive)}
.neg{color:var(--money-negative)}
.neu{color:var(--money-neutral)}
</style></head><body>
<div class="row">
  <div class="cell"><div class="lbl">入金 · positive</div><div class="val pos">+¥1,284,500</div></div>
  <div class="cell"><div class="lbl">出金 · negative</div><div class="val neg">(¥482,910)</div></div>
  <div class="cell"><div class="lbl">残高 · neutral</div><div class="val neu">¥3,562,180</div></div>
</div>
</body></html>
