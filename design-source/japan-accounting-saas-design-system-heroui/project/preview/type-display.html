<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--background)}
.row{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.spec{display:flex;flex-direction:column;gap:4px}
.spec .lbl{font:500 10px/1 var(--font-sans);color:var(--foreground-500);text-transform:uppercase;letter-spacing:.08em}
.spec .smp{font-family:var(--font-sans);color:var(--foreground)}
.meta{font-family:var(--font-numeric);font-size:10px;color:var(--foreground-400);margin-top:2px}
</style></head><body>
<div class="row">
  <div class="spec"><div class="lbl">Display 1</div><div class="smp display-1">¥12,345,678</div><div class="meta">Inter · 56 / 600 · tabular-nums</div></div>
  <div class="spec"><div class="lbl">Display 2</div><div class="smp display-2">¥482,910</div><div class="meta">Inter · 40 / 600 · tabular-nums</div></div>
</div>
</body></html>
