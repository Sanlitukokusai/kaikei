<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:40px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:500;border:0;cursor:pointer;color:#fff}
.btn.default{background:var(--zinc-300);color:#000}
.btn.primary{background:var(--blue-500)}
.btn.secondary{background:var(--purple-500)}
.btn.success{background:var(--green-500);color:#000}
.btn.warning{background:var(--yellow-500);color:#000}
.btn.danger{background:var(--red-500)}
.lbl{font-size:11px;color:var(--foreground-500);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
</style></head><body>
<div class="lbl">Color · solid variant</div>
<div class="row">
  <button class="btn default">default</button>
  <button class="btn primary">primary</button>
  <button class="btn secondary">secondary</button>
  <button class="btn success">success</button>
  <button class="btn warning">warning</button>
  <button class="btn danger">danger</button>
</div>
</body></html>
